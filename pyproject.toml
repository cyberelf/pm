[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zreport"
description = "zreport (Zero Report) command-line client for a local weekly-report workspace (projects, materials, TODOs)"
readme = "README-cli.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["weekly-report", "cli", "todo", "whisper"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/cyberelf/pm"

[project.scripts]
zreport = "zreport:main"

# the PyPI package ships the standard-library CLI only; the server
# (reports_app) stays a local app with its heavier deps installed from
# requirements.txt
[tool.setuptools]
py-modules = ["zreport"]

[tool.setuptools.dynamic]
version = { attr = "zreport.__version__" }
