# Docker Compose deployment mode for the zreport server.
#
#   docker compose up -d --build
#   curl --noproxy '*' "http://127.0.0.1:${PORT:-8765}/api/state"
#
# Host-side configuration comes from the repo-root .env (git-ignored):
# PORT, REPORTS_BIND, REPORTS_TLS_PORT, REPORTS_FAKE_PROVIDER,
# REPORTS_QUEUE_CAPACITY, REPORTS_QUEUE_PARALLELISM, REPORTS_ADMIN_PASSWORD,
# plus the LLM fallback keys commented below. ASR_* and WHISPER_CPP_VERSION
# configure the asr service. Container-internal values (bind address, inner
# port) are fixed here on purpose; reachability is controlled by the port
# mappings, which publish on the host loopback by default — set REPORTS_BIND
# (e.g. a VPN address, or 0.0.0.0) to serve other devices.

name: zreport

services:
  reports:
    build:
      context: .
      args:
        APT_MIRROR: "${APT_MIRROR:-}"
    image: zreport:latest
    restart: unless-stopped
    # Fixed unprivileged runtime uid; the named volume is initialized with
    # matching ownership from the image (see the mkdir/chown in the Dockerfile).
    user: "1000:1000"
    ports:
      # Host-side bind defaults to loopback so the service is not exposed on
      # every interface by accident; REPORTS_BIND overrides it.
      - "${REPORTS_BIND:-127.0.0.1}:${PORT:-8765}:8765"
      - "${REPORTS_BIND:-127.0.0.1}:${REPORTS_TLS_PORT:-8443}:8443"
    volumes:
      # All persistent state (SQLite, uploads, TLS certs, CLI config) lives in
      # a docker-managed named volume; nothing is written to the checkout, and
      # the modes never share state with the native LaunchAgent service.
      # Survives `docker compose down`; removed only by `docker compose down -v`.
      - reports-data:/app/data
    extra_hosts:
      # Lets voice TODOs reach an ASR service on the host machine (default
      # whisper.cpp port 8766): set the ASR endpoint to
      # http://host.docker.internal:8766/inference in 全局设置.
      - "host.docker.internal:host-gateway"
    environment:
      REPORTS_HOST: 0.0.0.0
      PORT: "8765"
      REPORTS_TLS_PORT: "8443"
      # Extra TLS certificate SAN. Defaults to REPORTS_HOST from .env so the
      # self-signed cert covers the address phones actually use.
      REPORTS_TLS_SAN: "${REPORTS_TLS_SAN:-${REPORTS_HOST:-}}"
      REPORTS_FAKE_PROVIDER: "${REPORTS_FAKE_PROVIDER:-0}"
      REPORTS_QUEUE_CAPACITY: "${REPORTS_QUEUE_CAPACITY:-}"
      REPORTS_QUEUE_PARALLELISM: "${REPORTS_QUEUE_PARALLELISM:-}"
      # Password for the bootstrapped admin account; when unset, a random
      # one-time password is generated and printed to the server log.
      REPORTS_ADMIN_PASSWORD: "${REPORTS_ADMIN_PASSWORD:-}"
      TZ: Asia/Shanghai
      NO_PROXY: "127.0.0.1,localhost,host.docker.internal,asr"
      # LLM fallback keys for the internal agent when 全局设置 has no stored
      # key. Git tokens are per-user values configured in 全局设置 instead.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/auth/state', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Local voice model for voice TODOs: whisper.cpp server serving /inference.
  # Requires a GGML model file in ./data/models (see README → Voice TODO);
  # set the ASR endpoint in 全局设置 to http://asr:8766/inference. The host
  # port stays free for the native service by default via ASR_PORT — when
  # both modes run on one machine, set ASR_PORT to something else in .env.
  asr:
    build:
      context: ./docker/asr
      args:
        APT_MIRROR: "${APT_MIRROR:-}"
        WHISPER_CPP_VERSION: "${WHISPER_CPP_VERSION:-v1.9.3}"
    image: zreport-asr:latest
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${ASR_PORT:-8766}:8766"
    volumes:
      # One shared model directory: the native install_service flow and this
      # container both read from data/models; never written by the server.
      - ./data/models:/models:ro
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8766"
      - "--model"
      - "/models/${ASR_MODEL:-ggml-large-v3-turbo-q5_0.bin}"
      - "--language"
      - "auto"
    healthcheck:
      # bash's /dev/tcp probe: no extra packages needed in the slim image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8766"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  reports-data:
