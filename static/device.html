<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设备授权 · zreport</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #111418; color: #e6e8eb;
    font: 15px/1.6 -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(360px, calc(100vw - 48px));
    background: #1a1f26; border: 1px solid #2a323d; border-radius: 10px;
    padding: 28px 28px 24px;
  }
  h1 { margin: 0 0 6px; font-size: 18px; }
  .hint { margin: 0 0 18px; color: #8b949e; font-size: 13px; }
  input {
    width: 100%; padding: 9px 10px; margin: 0 0 12px;
    background: #111418; color: #e6e8eb;
    border: 1px solid #2a323d; border-radius: 6px; font-size: 15px;
  }
  #user-code { letter-spacing: 2px; text-transform: uppercase; text-align: center; font-size: 18px; }
  button {
    width: 100%; padding: 9px 0; border: 0; border-radius: 6px;
    background: #2563eb; color: #fff; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: transparent; border: 1px solid #2a323d; color: #8b949e; margin-top: 8px; }
  button.secondary:hover { background: #1a1f26; color: #e6e8eb; }
  button[disabled] { opacity: .55; cursor: default; }
  .error { margin: 0 0 12px; color: #f87171; font-size: 13px; }
  .ok { margin: 0; color: #34d399; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>设备授权</h1>
  <p class="hint" id="hint">输入终端上显示的授权码，允许该设备访问你的账号。</p>

  <section id="step-login" hidden>
    <form id="login-form">
      <input id="username" autocomplete="username" placeholder="用户名" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="密码" required>
      <p class="error" id="login-error" hidden></p>
      <button type="submit" id="login-btn">登录</button>
    </form>
  </section>

  <section id="step-approve" hidden>
    <form id="approve-form">
      <input id="user-code" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="9" required>
      <p class="error" id="approve-error" hidden></p>
      <button type="submit" id="approve-btn">授权此设备</button>
      <button type="button" class="secondary" id="deny-btn">拒绝</button>
    </form>
  </section>

  <section id="step-done" hidden>
    <p class="ok" id="done-message">设备已授权，请回到终端继续。</p>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const show = (id) => {
  for (const step of ["step-login", "step-approve", "step-done"]) {
    $(step).hidden = step !== id;
  }
};

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(data.error || `HTTP ${response.status}`);
  }
  return data;
}

function fail(input, message) {
  $(input).hidden = false;
  $(input).textContent = message;
}

async function refresh() {
  try {
    const state = await api("GET", "/api/auth/state");
    if (state.authenticated) {
      show("step-approve");
      $("user-code").focus();
    } else {
      show("step-login");
      $("username").focus();
    }
  } catch (err) {
    fail("login-error", "无法连接服务：" + err.message);
    show("step-login");
  }
}

$("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("login-error").hidden = true;
  $("login-btn").disabled = true;
  try {
    await api("POST", "/api/auth/login", {
      username: $("username").value.trim(),
      password: $("password").value,
    });
    await refresh();
  } catch (err) {
    fail("login-error", err.message);
  } finally {
    $("login-btn").disabled = false;
  }
});

function readCode() {
  return $("user-code").value.trim().toUpperCase().replace(/\s+/g, "");
}

$("approve-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("approve-error").hidden = true;
  $("approve-btn").disabled = true;
  try {
    await api("POST", "/api/device/auth/approve", { user_code: readCode() });
    $("done-message").textContent = "设备已授权，请回到终端继续。";
    show("step-done");
  } catch (err) {
    fail("approve-error", err.message);
    $("approve-btn").disabled = false;
  }
});

$("deny-btn").addEventListener("click", async () => {
  $("approve-error").hidden = true;
  $("deny-btn").disabled = true;
  try {
    await api("POST", "/api/device/auth/deny", { user_code: readCode() });
    $("done-message").textContent = "已拒绝该设备的授权请求。";
    show("step-done");
  } catch (err) {
    fail("approve-error", err.message);
    $("deny-btn").disabled = false;
  }
});

refresh();
</script>
</body>
</html>
